<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>GS5 Vocabulary Game</title>
<style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif;background:#f5f7fb;color:#17233c}.app{max-width:1050px;margin:auto;padding:18px}.panel{background:#fff;border-radius:24px;padding:22px;box-shadow:0 8px 30px #18325a18}.center{text-align:center}.hidden{display:none!important}.small{color:#667085}.top{display:flex;justify-content:space-between;gap:12px}button{font:inherit;border:0;border-radius:16px;padding:13px 18px;cursor:pointer;font-weight:700}.primary,.counts button{background:#2563eb;color:#fff}.secondary{background:#eef2ff;color:#263d82}.danger{background:#fff0f0;color:#a61b1b}.counts{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}.speaker{width:82px;height:82px;border-radius:50%;font-size:34px;background:#2563eb;color:white}.choices{display:grid;grid-template-columns:repeat(2,1fr);gap:15px;margin-top:18px}.card{background:#fff;border:3px solid #e6eaf2;border-radius:20px;padding:10px;min-height:220px;display:flex;align-items:center;justify-content:center}.card img{max-width:100%;height:210px;object-fit:contain}.progress{height:10px;background:#e8edf5;border-radius:99px;overflow:hidden;margin:12px 0}.bar{height:100%;background:#2563eb}.feedback{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;z-index:10;padding:20px}.feedbackBox{background:white;border-radius:30px;padding:30px;max-width:520px;width:94%;text-align:center}.emoji{font-size:88px}.fireworks{font-size:42px;animation:pop .5s ease infinite alternate}@keyframes pop{to{transform:scale(1.15)}}@media(max-width:650px){.app{padding:10px}.panel{padding:14px}.card{min-height:155px}.card img{height:150px}.choices{gap:10px}}</style></head><body><main class="app">
<section id="start" class="panel center"><div style="font-size:58px">🎧</div><h1>GS5 Vocabulary Game</h1><p>Listen and choose the correct picture.</p><h3>Choose a round size</h3><div class="counts"><button data-n="10">10 Words</button><button data-n="20">20 Words</button><button data-n="30">30 Words</button><button data-n="999">All Words</button></div><p id="saved" class="small"></p><button id="reset" class="danger">Reset Progress</button></section>
<section id="game" class="panel hidden"><div class="top"><b id="mode"></b><b id="counter"></b></div><div class="progress"><div id="bar" class="bar"></div></div><div class="center"><button id="speaker" class="speaker">🔊</button><p class="small">Tap the speaker, then choose a picture.</p></div><div id="choices" class="choices"></div></section>
<section id="end" class="panel center hidden"><div class="emoji">⭐</div><h1>Round Complete!</h1><h2 id="score"></h2><p id="practiceInfo"></p><p id="overall" class="small"></p><div id="endButtons"></div></section></main>
<div id="feedback" class="feedback hidden"><div class="feedbackBox"><div id="fbEmoji" class="emoji"></div><div id="fireworks" class="fireworks"></div><h1 id="fbTitle"></h1><p id="fbText"></p></div></div>
<script>
const KEY="gs5_vocab_state_v1";let WORDS=[],state,questions=[],qi=0,points=0,mode="main",locked=false,audio=new Audio();const $=id=>document.getElementById(id),shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};function fresh(n=10){return{batch:n,deck:[],pos:0,wrong:[],current:null}}function save(){localStorage.setItem(KEY,JSON.stringify(state))}function load(){try{return JSON.parse(localStorage.getItem(KEY))}catch(e){return null}}function show(id){["start","game","end"].forEach(x=>$(x).classList.toggle("hidden",x!==id))}function w(id){return WORDS.find(x=>x.id===id)}function deck(){if(!state.deck.length){state.deck=shuffle(WORDS.map(x=>x.id));state.pos=0;save()}}function main(){deck();if(state.pos>=state.deck.length){state.deck=shuffle(WORDS.map(x=>x.id));state.pos=0}mode="main";questions=state.deck.slice(state.pos,Math.min(state.pos+state.batch,state.deck.length));state.current={mode,questions,qi:0,points:0};save();round()}function practice(){if(!state.wrong.length)return;mode="practice";questions=shuffle(state.wrong);state.current={mode,questions,qi:0,points:0};save();round()}function round(){qi=state.current.qi||0;points=state.current.points||0;show("game");render()}function render(){locked=false;let id=questions[qi],ans=w(id);$("mode").textContent=mode==="practice"?"Practice Wrong Words":"Vocabulary Round";$("counter").textContent=`${qi+1} / ${questions.length}`;$("bar").style.width=`${qi/questions.length*100}%`;let opts=shuffle([ans,...shuffle(WORDS.filter(x=>x.id!==id)).slice(0,3)]);$("choices").innerHTML="";opts.forEach(x=>{let b=document.createElement("button");b.className="card";let im=document.createElement("img");im.src=encodeURI(x.image);b.appendChild(im);b.onclick=()=>choose(x.id,id);$("choices").appendChild(b)});$("speaker").onclick=()=>{audio.src=encodeURI(ans.audio);audio.currentTime=0;audio.play().catch(()=>{})};setTimeout(()=>$("speaker").click(),150)}
function choose(c,correct){if(locked)return;locked=true;let ok=c===correct;if(ok)points++;if(mode==="main"&&!ok&&!state.wrong.includes(correct))state.wrong.push(correct);if(mode==="practice"&&ok)state.wrong=state.wrong.filter(x=>x!==correct);state.current.qi=qi;state.current.points=points;save();$("feedback").classList.remove("hidden");$("fbEmoji").textContent=ok?"🥳":"😢";$("fireworks").textContent=ok?"🎆 ✨ 🎇 ⭐":"";$("fbTitle").textContent=ok?"Great job!":"Oops! Not quite.";$("fbText").textContent=ok?"Excellent! You got it right!":`The correct answer is: ${correct.replace(/^GS5_/i,"").replaceAll("_"," ")}`;setTimeout(()=>{$("feedback").classList.add("hidden");qi++;if(qi>=questions.length)finish();else{state.current.qi=qi;state.current.points=points;save();render()}},2000)}
function finish(){if(mode==="main")state.pos+=questions.length;state.current=null;save();show("end");$("score").textContent=`You got ${points} out of ${questions.length} correct!`;$("practiceInfo").textContent=`Words to practice: ${state.wrong.length}`;$("overall").textContent=`Main progress: ${Math.min(state.pos,state.deck.length)} / ${state.deck.length} words`;let d=$("endButtons");d.innerHTML="";if(state.wrong.length){let p=document.createElement("button");p.className="secondary";p.textContent=`Practice ${state.wrong.length} Wrong Words`;p.onclick=practice;d.appendChild(p)}let n=document.createElement("button");n.className="primary";n.style.margin="8px";n.textContent=state.pos>=state.deck.length?"Start a New Round":`Next ${Math.min(state.batch,state.deck.length-state.pos)} Words`;n.onclick=()=>{if(state.pos>=state.deck.length){state.deck=shuffle(WORDS.map(x=>x.id));state.pos=0;save()}main()};d.appendChild(n)}
document.querySelectorAll("[data-n]").forEach(b=>b.onclick=()=>{state=fresh(Math.min(+b.dataset.n,WORDS.length));state.deck=shuffle(WORDS.map(x=>x.id));save();main()});$("reset").onclick=()=>{if(confirm("Reset all saved progress?")){state=fresh();save();location.reload()}};fetch("words.json").then(r=>r.json()).then(x=>{WORDS=x;state=load()||fresh();state.wrong=(state.wrong||[]).filter(id=>w(id));state.deck=(state.deck||[]).filter(id=>w(id));$("saved").textContent=state.deck.length?`Saved progress: ${state.pos||0} / ${WORDS.length} words · ${state.wrong.length} words to practice`:`${WORDS.length} vocabulary words`;if(state.current?.questions?.length){questions=state.current.questions;mode=state.current.mode;round()}else show("start")});
</script></body></html>
